name: snitch-digitalocean (PR audit)

# Audits live DigitalOcean ACCOUNT/RESOURCE posture — does NOT audit repo contents.
# Required repo secret: DIGITALOCEAN_ACCESS_TOKEN (read-only scoped — see
# templates/token-permissions.checklist.md, "Read-only audit" section).
#
# Behavior:
#   - FAIL rows fail the workflow (block the PR).
#   - WARN rows are surfaced in the PR comment but do not block.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: dosec-${{ github.head_ref }}
  cancel-in-progress: true

jobs:
  audit:
    name: DigitalOcean posture audit
    runs-on: ubuntu-latest
    if: ${{ github.event.pull_request.draft == false }}
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Verify API token is present
        env:
          DIGITALOCEAN_ACCESS_TOKEN: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}
        run: |
          if [ -z "$DIGITALOCEAN_ACCESS_TOKEN" ]; then
            echo "::error::Repo secret DIGITALOCEAN_ACCESS_TOKEN is not set."
            exit 1
          fi

      - name: Install jq + curl + doctl
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends jq curl
          curl -fsSL https://github.com/digitalocean/doctl/releases/latest/download/doctl-1.104.0-linux-amd64.tar.gz -o /tmp/doctl.tgz || true
          # Fallback: install via snap if the download URL changes.
          if ! tar -xzf /tmp/doctl.tgz -C /usr/local/bin 2>/dev/null; then
            sudo snap install doctl || true
          fi
          jq --version
          curl --version | head -n 1

      - name: Pull snitch-digitalocean skill
        run: |
          mkdir -p "$HOME/.claude/skills"
          if [ ! -d "$HOME/.claude/skills/snitch-digitalocean" ]; then
            cp -R ./.snitch-digitalocean "$HOME/.claude/skills/snitch-digitalocean"
          fi
          chmod +x "$HOME/.claude/skills/snitch-digitalocean/snitch-digitalocean.sh"

      - name: Run digests
        id: audit
        env:
          DIGITALOCEAN_ACCESS_TOKEN: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}
        run: |
          set -o pipefail
          {
            bash "$HOME/.claude/skills/snitch-digitalocean/snitch-digitalocean.sh" doctor
            bash "$HOME/.claude/skills/snitch-digitalocean/snitch-digitalocean.sh" state account digest > /tmp/account.json
            bash "$HOME/.claude/skills/snitch-digitalocean/snitch-digitalocean.sh" state droplets digest > /tmp/droplets.json
            bash "$HOME/.claude/skills/snitch-digitalocean/snitch-digitalocean.sh" state databases digest > /tmp/databases.json
            bash "$HOME/.claude/skills/snitch-digitalocean/snitch-digitalocean.sh" state firewalls digest > /tmp/firewalls.json
            bash "$HOME/.claude/skills/snitch-digitalocean/snitch-digitalocean.sh" state apps digest > /tmp/apps.json
          } 2>&1 | tee /tmp/dosec-output.txt
          rc=$?
          fail_count=$(grep -cE '^\[FAIL\]' /tmp/dosec-output.txt || true)
          warn_count=$(grep -cE '^\[WARN\]' /tmp/dosec-output.txt || true)
          ok_count=$(grep -cE '^\[OK\]' /tmp/dosec-output.txt || true)
          {
            echo "fail_count=$fail_count"
            echo "warn_count=$warn_count"
            echo "ok_count=$ok_count"
            echo "rc=$rc"
          } >> "$GITHUB_OUTPUT"

      - name: Post PR comment
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const output = fs.readFileSync('/tmp/dosec-output.txt', 'utf8');
            const fail = parseInt('${{ steps.audit.outputs.fail_count }}', 10) || 0;
            const warn = parseInt('${{ steps.audit.outputs.warn_count }}', 10) || 0;
            const ok = parseInt('${{ steps.audit.outputs.ok_count }}', 10) || 0;
            const verdict = fail > 0 ? 'Failed' : (warn > 0 ? 'Warnings' : 'Pass');
            const truncated = output.length > 60000
              ? output.slice(0, 60000) + '\n\n... [truncated; full output in workflow logs] ...'
              : output;
            const body = [
              '## snitch-digitalocean audit ' + verdict,
              '',
              '| | OK | WARN | FAIL |',
              '|---|---|---|---|',
              '| | ' + ok + ' | ' + warn + ' | ' + fail + ' |',
              '',
              '<details><summary>Full audit output</summary>',
              '',
              '```',
              truncated,
              '```',
              '</details>'
            ].join('\n');
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number
            });
            const existing = comments.find(c =>
              c.user.type === 'Bot' && c.body && c.body.startsWith('## snitch-digitalocean audit')
            );
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body
              });
            }

      - name: Gate on FAIL rows
        run: |
          fail=${{ steps.audit.outputs.fail_count }}
          if [ "${fail:-0}" -gt 0 ]; then
            echo "::error::snitch-digitalocean found $fail FAIL row(s)."
            exit 1
          fi
