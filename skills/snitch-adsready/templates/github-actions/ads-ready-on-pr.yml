name: ads-ready

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:
    inputs:
      url:
        description: "URL to score (defaults to ADSREADY_URL secret)"
        required: false
        type: string

permissions:
  contents: read
  pull-requests: write

jobs:
  score:
    name: ads-ready score
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install jq + curl
        run: sudo apt-get update -y && sudo apt-get install -y --no-install-recommends jq curl

      - name: Install ads-ready skill
        run: |
          mkdir -p "$HOME/.claude/skills"
          if [ -f "$GITHUB_WORKSPACE/.claude/skills/ads-ready/ads-ready.sh" ]; then
            echo "Using vendored skill in repo."
            ln -sf "$GITHUB_WORKSPACE/.claude/skills/ads-ready" "$HOME/.claude/skills/ads-ready"
          else
            echo "Pulling ads-ready from khuur.dev/skills."
            curl -fsSL "https://khuur.dev/skills/install.sh" | bash -s ads-ready
          fi

      - name: Determine target URL
        id: target
        run: |
          URL="${{ inputs.url }}"
          if [ -z "$URL" ]; then URL="${{ secrets.ADSREADY_URL }}"; fi
          if [ -z "$URL" ]; then
            echo "::error::No URL provided. Set the ADSREADY_URL secret or pass `url` input."
            exit 1
          fi
          echo "url=$URL" >> "$GITHUB_OUTPUT"

      - name: Run ads-ready score
        id: score
        env:
          PSI_API_KEY: ${{ secrets.PSI_API_KEY }}
        run: |
          set -uo pipefail
          OUT="$(bash "$HOME/.claude/skills/ads-ready/ads-ready.sh" score "${{ steps.target.outputs.url }}" 2> >(tee /tmp/score.err >&2))"
          printf '%s\n' "$OUT" > /tmp/score.json
          GRADE="$(jq -r '.composite_grade // "?"' /tmp/score.json)"
          POINTS="$(jq -r '.composite_points // "?"' /tmp/score.json)"
          {
            echo "## ads-ready score"
            echo ""
            echo "Target: \`${{ steps.target.outputs.url }}\`"
            echo "Composite: **${GRADE}** (${POINTS}/100)"
            echo ""
            echo "<details><summary>Full JSON</summary>"
            echo ""
            echo "\`\`\`json"
            cat /tmp/score.json
            echo "\`\`\`"
            echo "</details>"
            if [ -s /tmp/score.err ]; then
              echo ""
              echo "<details><summary>stderr</summary>"
              echo ""
              echo "\`\`\`"
              cat /tmp/score.err
              echo "\`\`\`"
              echo "</details>"
            fi
          } > /tmp/score.md
          echo "grade=${GRADE}" >> "$GITHUB_OUTPUT"

      - name: Comment on PR
        if: github.event_name == 'pull_request'
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          path: /tmp/score.md
          header: ads-ready

      - name: Job summary
        if: always()
        run: cat /tmp/score.md >> "$GITHUB_STEP_SUMMARY"
