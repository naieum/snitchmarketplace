<!-- Pinterest Tag — https://help.pinterest.com/en/business/article/install-the-pinterest-tag -->
<!-- Replace {{PINTEREST_TAG_ID}}. Supports Enhanced Match by passing hashed em/hem as 2nd arg to load(). -->
<script>
  !function(e){if(!window.pintrk){window.pintrk = function () {
  window.pintrk.queue.push(Array.prototype.slice.call(arguments))};var
    n=window.pintrk;n.queue=[],n.version="3.0";var
    t=document.createElement("script");t.async=!0,t.src=e;var
    r=document.getElementsByTagName("script")[0];
    r.parentNode.insertBefore(t,r)}}("https://s.pinimg.com/ct/core.js");

  // Optional: pass hashed email for Enhanced Match -> { em: '<sha256-of-email>' }
  pintrk('load', '{{PINTEREST_TAG_ID}}');
  pintrk('page');
</script>
<noscript>
  <img height="1" width="1" style="display:none;" alt=""
       src="https://ct.pinterest.com/v3/?tid={{PINTEREST_TAG_ID}}&event=init&noscript=1" />
</noscript>
