name: snitch-flyio on PR

# Runs the offline portions of the snitch-flyio skill against every PR. The
# audit-with-tokens portions require FLY_API_TOKEN; if you provide one as a
# repo secret, the workflow also runs the read-only state checks.

on:
  pull_request:
    branches: [main, master]
    paths:
      - "fly.toml"
      - "fly.*.toml"
      - "Dockerfile"
      - ".github/workflows/snitch-flyio-on-pr.yml"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  snitch-flyio:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Install flyctl (for read-only checks)
        if: env.FLY_API_TOKEN != ''
        uses: superfly/flyctl-actions/setup-flyctl@master
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      - name: Detect (offline)
        run: |
          # The skill itself lives in ~/.claude/skills/snitch-flyio on dev machines.
          # In CI we vendor a pinned copy under .ci/snitch-flyio/ — adjust the path.
          if [[ -d .ci/snitch-flyio ]]; then
            bash .ci/snitch-flyio/snitch-flyio.sh detect | tee detect.json
          else
            echo "skipping: vendor snitch-flyio under .ci/snitch-flyio/ to enable"
          fi

      - name: Apps audit (read-only)
        if: env.FLY_API_TOKEN != ''
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          if [[ -d .ci/snitch-flyio ]]; then
            bash .ci/snitch-flyio/snitch-flyio.sh state apps | tee state-apps.json || true
            bash .ci/snitch-flyio/snitch-flyio.sh fix apps   | tee fix-apps.txt   || true
          fi

      - name: Comment on PR
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let body = '## snitch-flyio report\n\n';
            for (const f of ['fix-apps.txt']) {
              if (fs.existsSync(f)) {
                body += `### ${f}\n\n\`\`\`\n${fs.readFileSync(f, 'utf8').slice(0, 6000)}\n\`\`\`\n\n`;
              }
            }
            if (body.length < 100) body += '_no findings emitted (skill not vendored or no token configured)_\n';
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body,
            });
